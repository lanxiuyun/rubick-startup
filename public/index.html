<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>启动收藏</title>
<style>
:root{color-scheme:light;--bg:#fff;--paper:#fff;--line:#e4ebf5;--text:#243248;--muted:#63758c;--faint:#83909d;--chip:#f0f4fa;--chip-text:#536a86;--ink:#2864ed;--sel:#f0f5ff;--red:#c34d4d;--amber:#c27a24;--green:#278455}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:13px/1.35 "Segoe UI","Microsoft YaHei",sans-serif;overflow:hidden}
.app{display:flex;flex-direction:column;height:100vh;padding:0 16px 12px}
/* 唯一的顶栏：筛选标签在左、＋ 新建标签 */
.bar{display:flex;align-items:center;gap:10px;flex:none;height:52px;margin-bottom:0;border-bottom:1px solid var(--line);background:var(--paper)}
.tags{display:flex;align-items:center;gap:6px;flex:1;min-width:0;overflow-x:auto;overflow-y:hidden;scrollbar-width:none;height:32px}
.tags::-webkit-scrollbar{display:none}
.tag{display:inline-flex;align-items:center;gap:7px;border:1px solid transparent;background:var(--chip);border-radius:6px;padding:5px 10px;color:var(--chip-text);font-size:12px;line-height:16px;white-space:nowrap;cursor:pointer;flex:none;transition:background .16s,color .16s,border-color .16s}
.tag:hover{background:#e6edf9;color:#2c4d7b}
.tag .n{min-width:16px;color:#70839e;text-align:center;font:10px/14px ui-monospace,Consolas,monospace}
.tag.on{background:var(--ink);color:#fff}
.tag.on:hover{background:#2157d2}
.tag.on .n{color:#dce8ff}
.tag.add{background:#fff;border:1px solid #d9e0e5;color:#526170}
.tag.add:hover{border-color:#adc7ff;color:var(--ink);background:var(--sel)}
.tag input,.tag-editor input{border:0;outline:none;background:transparent;font:12px "Segoe UI","Microsoft YaHei",sans-serif;width:84px;padding:0;color:var(--text)}
.tag-editor{display:inline-flex;align-items:center;gap:3px;padding:2px 4px 2px 9px;border:1px solid #adc7ff;border-radius:6px;background:var(--sel)}
.tag-editor input{width:100px}
.tag-editor button{width:22px;height:22px;padding:0;border:0;border-radius:4px;background:transparent;color:#526170;font:16px/1 "Segoe UI",sans-serif;cursor:pointer}
.tag-editor button:hover{background:#e0eaff;color:var(--ink)}
.tag-editor button.confirm{color:var(--ink);font-size:14px}
.tag-editor button.cancel:hover{background:#f8eaea;color:var(--red)}
/* 列表 */
.list{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;position:relative;padding:8px 0;background:var(--paper)}
.spacer{position:relative;width:100%}
/* 行高不写在这里：由脚本常量 ROW_H 内联设置，避免两处漂移 */
.row{position:absolute;left:0;right:0;display:flex;align-items:center;gap:12px;padding:0 12px;border:1px solid transparent;border-radius:7px;cursor:pointer;transition:background .14s,border-color .14s}
.row:hover{background:#f7f9fd}
.row.sel{background:var(--sel);border-color:#cbdcff}
.ico{width:30px;height:30px;border:1px solid currentColor;border-radius:7px;flex:none;display:flex;align-items:center;justify-content:center}
.ico svg{width:16px;height:16px}
.ico.term{background:#f1f6ff;color:#2f6bd8;border-color:#d8e5ff}
.ico.path{background:#fff8ed;color:#d9822b;border-color:#ffe4bd}
.ico.url{background:#effbff;color:#1288ac;border-color:#cbecf7}
.ico.calc,.ico.pad{background:#effbf5;color:#2f9e5f;border-color:#d0efde}
.cmd{flex:1;min-width:0;font:14px/1.4 Consolas,"Microsoft YaHei",monospace;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#263543}
.chips{display:flex;align-items:center;gap:5px;flex:none;max-width:45%;overflow:hidden}
.chip{position:relative;display:inline-flex;align-items:center;justify-content:center;gap:3px;min-width:0;background:#edf2f9;border:1px solid #e1e8f2;border-radius:5px;padding:0 9px;height:22px;color:#435b7a;font-size:12px;font-weight:500;white-space:nowrap;max-width:110px}
.chip span{overflow:hidden;text-overflow:ellipsis}
/* × 平时不显形（跟设计图一致），鼠标停在 chip 上才出现；DOM 里始终在，键盘/测试都还能点到 */
.chip .x{position:absolute;right:1px;top:1px;display:flex;align-items:center;justify-content:center;width:16px;height:18px;background:#edf2f9;border-radius:3px;color:#70839e;cursor:pointer;font-style:normal;font-size:13px;line-height:1;opacity:0;pointer-events:none;transition:opacity .12s}
.chip:hover .x{opacity:1;pointer-events:auto}
.chip .x:hover{color:var(--red)}
.chip.more{background:transparent;border-color:transparent;color:var(--muted);padding:0 2px}
.time{flex:none;width:38px;margin-left:6px;text-align:right;font:11px/1 Consolas,monospace;color:#63758c}
.tag:focus-visible,.row:focus-visible{outline:2px solid var(--ink);outline-offset:1px}
.empty{padding:22px 4px;text-align:center;color:var(--muted);font-size:12px}
/* 右键/加标签菜单 */
.menu{position:fixed;z-index:50;background:#fff;border:1px solid var(--line);border-radius:8px;box-shadow:0 8px 24px #1f24301f;padding:4px;min-width:150px;max-height:240px;overflow:auto;display:none}
.menu.show{display:block}
.menu .mi{padding:5px 8px;border-radius:5px;font-size:12px;cursor:pointer;white-space:nowrap;display:flex;justify-content:space-between;gap:10px;color:var(--text)}
.menu .mi:hover{background:var(--sel)}
.menu .sep{height:1px;background:var(--line);margin:4px 2px}
.menu .mi.danger{color:var(--red)}
.menu input{width:100%;border:1px solid var(--line);border-radius:5px;padding:3px 6px;font:12px inherit;outline:none}
.toast{position:fixed;left:50%;bottom:12px;transform:translateX(-50%) translateY(14px);background:var(--ink);color:#f5f6f8;font-size:11px;padding:6px 13px;border-radius:7px;opacity:0;pointer-events:none;transition:.18s}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
@media(max-width:480px){
 .app{padding:0 10px 10px}
 .row{gap:8px;padding:0 8px}
 .chips{max-width:30%;gap:3px}
 .chip{padding:0 5px}
 .time{margin-left:0}
}
@media(prefers-reduced-motion:reduce){.tag,.row,.toast,.chip .x{transition:none}}
</style></head>
<body><div class="app">
  <div class="bar"><div class="tags" id="tags"></div></div>
  <div class="list" id="list"><div class="spacer" id="spacer"></div></div>
</div>
<div class="menu" id="menu"></div>
<div class="toast" id="toast"></div>
<script>
(()=>{
 // 启动收藏 · 字符串管理 + 标签
 //
 // 模型：列表里的每一项就是一条字符串（路径或命令）。
 //   搜索框输入 → 回车运行 → 字符串进列表；给字符串打标签 → 永久保留。
 //   标签显示在记录下方（chips），点标签筛选，点记录重跑。
 //
 // 输入层的实证（反编译 app.asar + 真机探测）：
 //   - 搜索框内容经 rubick.setSubInput(onChange) 同步送来 {text}，每次变化都触发
 //   - 搜索框的 Enter 被 sendInputEvent 转发进页面；合成事件只有 keyCode、没有 key
 //   - rubick.setSubInputValue(text) 可反写搜索框（执行后清空用）
 //   - @electron/remote 不可用；插件页 nodeIntegration:true 可直接 require
 const KEY='rubick-startup/history-v2';
 const LIMIT=500;        // 只约束【没有标签】的临时记录；打过标签的永久保留
 const ROW_H=56;         // 固定行高：30px 图标 + 上下留白，虚拟滚动硬约束，改它必须同步布局
 let records=[], activeGroup='', currentCommand='', subInputReady=false, rowsDirty=true;
 let selIndex=-1, selId=null;   // 上下键选中的那条（-1 = 没选，回车跑输入的原文）
 let scrollTop=0, renderFrom=0, renderTo=0, menuTarget=null;
 const $=id=>document.getElementById(id);
 // ── 运行环境 ──────────────────────────────────────────────────
 const env={spawn:null,fs:null,logPath:null,reason:''};
 try{if(typeof require==='function'){env.spawn=require('child_process').spawn}}catch(e){env.spawn=null}
 try{
  if(typeof require==='function'){
   env.fs=require('fs');
   const os=require('os'),path=require('path');
   env.logPath=path.join(os.tmpdir(),'rubick-startup.log');
  }
 }catch(e){env.fs=null;env.logPath=null}
 const canRun=typeof env.spawn==='function';
 if(!canRun){
  env.reason=typeof require==='function'
   ?'require 可用，但取不到 child_process'
   :'页面里没有 require（Rubick 未启用 nodeIntegration？）';
 }
 const rubick=(typeof window!=='undefined'&&window.rubick)?window.rubick:null;
 // 时间源可注入：生产真实时钟，测试虚拟时钟（否则去重窗口会让测试又慢又脆）
 const now=(typeof window!=='undefined'&&typeof window.__rubickStartupNow==='function')?window.__rubickStartupNow:Date.now;
 const schedule=(typeof window!=='undefined'&&typeof window.__rubickStartupSchedule==='function')?window.__rubickStartupSchedule:setTimeout;
 function logLine(kind,message){
  const line=new Date(now()).toISOString()+' ['+kind+'] '+message+'\n';
  try{console.info('[rubick-startup]',kind,message)}catch(e){}
  try{if(env.fs&&env.logPath)env.fs.appendFileSync(env.logPath,line)}catch(e){}
 }
 try{
  if(env.fs&&env.logPath){
   if(env.fs.existsSync(env.logPath)&&env.fs.statSync(env.logPath).size>256*1024)env.fs.writeFileSync(env.logPath,'');
   let version='?';
   try{version=require('../package.json').version}catch(e){}
   logLine('session','打开插件 v'+version);
  }
 }catch(e){}
 const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
 const fuzzy=(text,query)=>{let t=String(text||'').toLocaleLowerCase(),q=query.toLocaleLowerCase().trim();if(!q)return 1;if(t.includes(q))return 100-q.length;let ti=0,st=-1,gap=0,last=-1;for(const ch of q){const at=t.indexOf(ch,ti);if(at<0)return 0;if(st<0)st=at;if(last>=0)gap+=at-last-1;last=at;ti=at+1}return Math.max(1,65-st-gap)};
 const groupsOf=r=>Array.isArray(r.groups)?r.groups:[];
 // 标签从记录里长出来；pinnedGroups 存"还没有记录引用的空标签"，否则新建完就消失了
 let pinnedGroups=[];
 // 标签从记录里长出来；顺手算出计数给筛选胶囊用（没有记录引用的空标签计 0）
 function allGroupCounts(){
  const seen=new Map();
  records.forEach(r=>groupsOf(r).forEach(g=>seen.set(g,(seen.get(g)||0)+1)));
  pinnedGroups.forEach(g=>{if(!seen.has(g))seen.set(g,0)});
  return seen;
 }
 function allGroups(){
  return [...allGroupCounts().entries()].sort((a,b)=>b[1]-a[1]||a[0].localeCompare(b[0])).map(x=>x[0]);
 }
 // ── 存储 ──────────────────────────────────────────────────────
 function load(){try{if(rubick&&rubick.db){const d=rubick.db.get(KEY);if(d&&Array.isArray(d.records))return d.records}}catch(e){}try{const d=JSON.parse(localStorage.getItem(KEY));if(Array.isArray(d))return d}catch(e){}return []}
 function save(){try{if(rubick&&rubick.db){let old=null;try{old=rubick.db.get(KEY)}catch(e){}const doc={_id:KEY,records};if(old&&old._rev)doc._rev=old._rev;rubick.db.put(doc);return}}catch(e){}try{localStorage.setItem(KEY,JSON.stringify(records))}catch(e){toast('保存失败')}}
 function toast(msg){const el=$('toast');el.textContent=msg;el.classList.add('show');schedule(()=>el.classList.remove('show'),1800)}
 // 复制命令：真机走 Electron 的 clipboard（页面有 nodeIntegration）；桩环境里
 // require('electron') 会抛错、document.body 也不存在，所以三层兜底全包在 try 里，失败如实返回 false
 function copyText(text){
  const value=String(text??'');
  try{
   if(typeof require==='function'){
    const clip=require('electron').clipboard;
    if(clip&&typeof clip.writeText==='function'){clip.writeText(value);return true}
   }
  }catch(e){}
  try{
   if(typeof navigator!=='undefined'&&navigator.clipboard&&navigator.clipboard.writeText){
    const p=navigator.clipboard.writeText(value);
    if(p&&typeof p.catch==='function')p.catch(()=>{});
    return true;
   }
  }catch(e){}
  try{
   const box=document.createElement('textarea');
   box.value=value;
   document.body.appendChild(box);
   box.select();
   document.execCommand('copy');
   document.body.removeChild(box);
   return true;
  }catch(e){}
  return false;
 }
 function guessKind(s){const t=s.trim();if(/^[a-z][a-z0-9+.-]*:\/\//i.test(t))return'url';return /^[a-zA-Z]:[\\/]|^\\\\|^\.\.?[\\/]/.test(t)?'path':'command'}
 // 上限只作用于没有标签的临时记录；打了标签的永久保留
 function prune(list){
  const tagged=[],plain=[];
  for(const r of list)(groupsOf(r).length?tagged:plain).push(r);
  return [...tagged,...plain.slice(0,LIMIT)].sort((a,b)=>b.time-a.time);
 }
 function persist(){records=prune(records);save()}
 // ── 运行 ──────────────────────────────────────────────────────
 function spawnCommand(command,cb){
  if(!canRun){logLine('run','拒绝：'+(env.reason||'无法执行'));cb({ok:false,error:env.reason||'无法执行命令'});return}
  let child;
  try{
   child=env.spawn('cmd.exe',['/d','/s','/c',command],{detached:true,windowsHide:true,stdio:'ignore'});
  }catch(error){logLine('run','spawn 抛错：'+error.message);cb({ok:false,error:error.message});return}
  let settled=false;
  const once=result=>{
   if(settled)return;
   settled=true;
   logLine('run',(result.ok?'已启动：':'失败：')+command.slice(0,160)+(result.ok?'':' · '+result.error));
   cb(result);
  };
  try{child.once('error',error=>once({ok:false,error:(error&&error.message)||'未知错误'}))}catch(e){}
  try{child.once('spawn',()=>{once({ok:true});try{child.unref()}catch(e){}})}catch(e){}
  schedule(()=>once({ok:false,error:'启动请求超时'}),2500);
 }
 let lastRun=0;
 function remember(command){
  const stamp=now();
  const hit=records.find(r=>r.command===command);
  if(hit){hit.time=stamp;hit.kind=guessKind(command);return hit}
  const rec={id:'run-'+stamp+'-'+Math.random().toString(36).slice(2,7),command,time:stamp,kind:guessKind(command),groups:[]};
  records.unshift(rec);
  return rec;
 }
 function launch(text){
  // 同步取原文：清空搜索框会触发回调，之后不能再读状态
  const command=String(text??'').trim();
  if(!command){toast('先输入路径或命令');return}
  const ts=now();
  if(ts-lastRun<180)return;   // 同一次回车可能从两条路各到达一次
  lastRun=ts;
  remember(command);
  persist();
  renderAll();
  if(subInputReady&&rubick&&typeof rubick.setSubInputValue==='function'){
   try{rubick.setSubInputValue('')}catch(e){}
  }
  spawnCommand(command,result=>{
   logLine('run-result',result.ok?'ok':'fail');
   toast(result.ok?'已提交给 Windows':'启动失败：'+(result.error||'未知错误'));
  });
 }
 // ── 列表：虚拟滚动（固定行高） ────────────────────────────────
 function visible(){
  const q=currentCommand.trim().toLowerCase();
  return records
   .filter(r=>!activeGroup||groupsOf(r).includes(activeGroup))
   .map(r=>({r,score:q?Math.max(fuzzy(r.command,q),...groupsOf(r).map(g=>fuzzy(g,q))):1}))
   .filter(x=>x.score>0)
   .sort((a,b)=>b.r.time-a.r.time)
   .map(x=>x.r);
 }
 // ── 图标 / 时间 / 单行渲染 ────────────────────────────────────
 // 图标只有 5 个字形：终端、文件夹、地球（URL）、计算器、记事本。
 // 颜色交给 CSS 的 .ico.<key>；字形内联 SVG —— 插件要能离线用，不能引外链图标库。
 const SVG_HEAD='<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">';
 const GLYPH={
  term:'<rect x="1.8" y="2.8" width="12.4" height="10.4" rx="2.2"/><path d="M4.6 6.2l2 1.8-2 1.8"/><path d="M8.6 10h2.6"/>',
  folder:'<path d="M1.8 4.4c0-.8.6-1.4 1.4-1.4h3l1.4 1.6h4.4c.8 0 1.4.6 1.4 1.4v5.6c0 .8-.6 1.4-1.4 1.4H3.2c-.8 0-1.4-.6-1.4-1.4z"/>',
  globe:'<circle cx="8" cy="8" r="6"/><path d="M2.2 8h11.6"/><path d="M8 2c1.7 1.9 1.7 10.1 0 12"/><path d="M8 2c-1.7 1.9-1.7 10.1 0 12"/>',
  calc:'<rect x="3.4" y="1.8" width="9.2" height="12.4" rx="1.8"/><path d="M5.8 4.8h4.4"/><path d="M6 8.2h.01M8 8.2h.01M10 8.2h.01M6 10.6h.01M8 10.6h.01M10 10.6h.01"/>',
  pad:'<rect x="2.8" y="1.8" width="10.4" height="12.4" rx="1.8"/><path d="M5.4 5.4h5.2M5.4 8h5.2M5.4 10.6h3"/>'
 };
 // 三档兜底：URL → 地球、路径 → 文件夹、其它 → 终端；再给少数高频命令单独特判
 function iconKey(r){
  const kind=r.kind;
  if(kind==='url')return'url';
  if(kind==='path')return'path';
  const name=String(r.command||'').trim().toLowerCase().split(/[\\/]/).pop().replace(/\.exe$/,'');
  if(name==='calc'||name==='calculator')return'calc';
  if(name==='notepad')return'pad';
  return'term';
 }
 function iconHtml(r){
  const key=iconKey(r);
  const glyph=key==='path'?'folder':key==='url'?'globe':key==='calc'?'calc':key==='pad'?'pad':'term';
  return '<span class="ico '+key+'">'+SVG_HEAD+GLYPH[glyph]+'</svg></span>';
 }
 // 今天只显示 12:40，更早显示 10-11
 function timeText(ts){
  const d=new Date(ts),base=new Date(now());
  const pad=n=>String(n).padStart(2,'0');
  const today=d.getFullYear()===base.getFullYear()&&d.getMonth()===base.getMonth()&&d.getDate()===base.getDate();
  return today?pad(d.getHours())+':'+pad(d.getMinutes()):pad(d.getMonth()+1)+'-'+pad(d.getDate());
 }
 // 单行：命令 + 右侧标签（最多 2 个 + N）+ 最右时间。命令只有一行，行高才是常量
 function rowHtml(r){
  const groups=groupsOf(r);
  const chips=groups.slice(0,2).map(g=>'<span class="chip" data-ungroup="'+esc(g)+'"><span>'+esc(g)+'</span><i class="x" data-ungroup="'+esc(g)+'">×</i></span>').join('')
   +(groups.length>2?'<span class="chip more">+'+(groups.length-2)+'</span>':'');
  return '<span class="cmd" title="'+esc(r.command)+'">'+esc(r.command)+'</span>'
   +'<span class="chips">'+chips+'</span>'
   +'<span class="time">'+timeText(r.time)+'</span>';
 }
 function renderRows(){
  const list=visible();
  const total=list.length;
  const spacer=$('spacer');
  spacer.style.height=total?(total*ROW_H)+'px':'auto';
  const viewport=$('list').clientHeight||0;
  const from=Math.max(0,Math.floor(scrollTop/ROW_H)-2);
  const to=Math.min(total,Math.ceil((scrollTop+viewport)/ROW_H)+2);
  // 只有"数据变了"或"可见窗口真的移动了"才重建 DOM
  if(!rowsDirty&&from===renderFrom&&to===renderTo)return;
  rowsDirty=false;
  renderFrom=from;renderTo=to;
  const frag=document.createDocumentFragment();
  if(!total){
   const empty=document.createElement('div');
   empty.className='empty';
   empty.textContent=records.length?'没有匹配的记录':'还没有记录 —— 在 Rubick 搜索框输入命令后回车';
   frag.appendChild(empty);
  }
  for(let i=from;i<to;i++){
   const r=list[i];
   const row=document.createElement('div');
   row.className='row'+(i===selIndex?' sel':'');
   row.style.top=(i*ROW_H)+'px';
   row.style.height=ROW_H+'px';
   row.dataset.id=r.id;
   row.innerHTML=iconHtml(r)+rowHtml(r);
   frag.appendChild(row);
  }
  spacer.querySelectorAll('.row,.empty').forEach(el=>el.remove());
  spacer.appendChild(frag);
 }
 function renderTags(){
  const counts=allGroupCounts();
  const groups=allGroups();
  const el=$('tags');
  // 一行搞定：全部（带总数）→ 各标签（带计数）→ ＋ 添加
  el.innerHTML='<span class="tag'+(activeGroup?'':' on')+'" data-group="">全部<span class="n">'+records.length+'</span></span>'
   +groups.map(g=>'<span class="tag'+(activeGroup===g?' on':'')+'" data-group="'+esc(g)+'">'+esc(g)+'<span class="n">'+(counts.get(g)||0)+'</span></span>').join('')
   +'<span class="tag add" id="tagAdd" title="新建标签">＋ 标签</span>';
 }

// ── 选中：上下键在列表里走，回车跑选中的 ──────────────────────
 // selIndex 是【当前过滤结果】里的下标，所以每次过滤/换标签都要重置，
 // 否则选中的会指向另一条记录。
 function selectedRecord(){
  if(selIndex<0)return null;
  const list=visible();
  return list[selIndex]||null;
 }
 function ensureSelectionVisible(){
  const list=$('list');
  const total=visible().length;
  if(!total)return;
  $('spacer').style.height=(total*ROW_H)+'px';
  const top=selIndex*ROW_H;
  const viewH=list.clientHeight||0;
  if(top<list.scrollTop)list.scrollTop=top;
  else if(top+ROW_H>list.scrollTop+viewH)list.scrollTop=top+ROW_H-viewH;
  scrollTop=list.scrollTop;
 }
 function moveSelection(delta){
  const list=visible();
  if(!list.length)return false;
  if(selIndex<0)selIndex=delta>0?0:list.length-1;
  else selIndex=Math.max(0,Math.min(list.length-1,selIndex+delta));
  selId=list[selIndex].id;
  rowsDirty=true;renderRows();
  ensureSelectionVisible();
  rowsDirty=true;renderRows();   // 滚动后可见窗口变了，再画一次保证高亮行在窗口里
  return true;
 }
 function clearSelection(){selIndex=-1;selId=null}
 // ── 数据或过滤条件变了就标记重绘：比"比较窗口范围"可靠，空列表也能正确渲染
 function renderAll(){rowsDirty=true;renderTags();renderRows()}
 // ── 标签本身的增删改 ──────────────────────────────────────────
 // 标签是从记录里长出来的，所以"建/删/改名"都要落到记录上
 function renameGroup(oldName,newName){
  const name=String(newName||'').trim();
  if(!name||name===oldName)return;
  let touched=0;
  records.forEach(r=>{
   const g=groupsOf(r);
   if(!g.includes(oldName))return;
   r.groups=[...new Set(g.map(x=>x===oldName?name:x))];
   touched++;
  });
  if(!touched)return;
  if(activeGroup===oldName)activeGroup=name;
  persist();renderAll();
  toast('已重命名为「'+name+'」');
 }
 function deleteGroup(name){
  let touched=0;
  records.forEach(r=>{
   const g=groupsOf(r);
   if(!g.includes(name))return;
   r.groups=g.filter(x=>x!==name);
   touched++;
  });
  if(activeGroup===name)activeGroup='';
  persist();renderAll();
  toast(touched?('已删除标签「'+name+'」，'+touched+' 条记录已移出'):('已删除标签「'+name+'」'));
 }
 function tagMenu(name,x,y){
  menuTarget={tag:name};
  showMenu(x,y,'<div class="mi" data-tagact="rename">重命名标签</div>'
   +'<div class="mi danger" data-tagact="delete">删除标签</div>');
 }
 // 顶栏里的内联输入：新建标签 / 重命名
 function inlineTagInput(mode,oldName){
  const box=$('tags');
  box.innerHTML='<span class="tag-editor"><input id="tagInput" placeholder="'+(mode==='rename'?'新名字':'标签名')+'，回车确认"><button class="confirm" id="tagConfirm" type="button" title="确认" aria-label="确认">✓</button><button class="cancel" id="tagCancel" type="button" title="取消" aria-label="取消">×</button></span>';
  const input=$('tagInput');
  const submit=()=>{
   const value=input.value;
   if(mode==='create')createGroup(value);
   else renameGroup(oldName,value);
  };
  try{input.focus()}catch(e){}
  input.addEventListener('keydown',ev=>{
   if(isEnterKey(ev)){
    ev.preventDefault();
    submit();
   }else if(ev.key==='Escape'||ev.keyCode===27){
    renderTags();
   }
   ev.stopPropagation();
  });
  input.addEventListener('click',ev=>ev.stopPropagation());
  $('tagConfirm').addEventListener('click',ev=>{ev.stopPropagation();submit()});
  $('tagCancel').addEventListener('click',ev=>{ev.stopPropagation();renderTags()});
 }
 // 新建一个空标签：没有记录引用它，所以用 pinnedGroups 记住，避免它"消失"
 function createGroup(rawName){
  const name=String(rawName||'').trim();
  if(!name){renderTags();return}
  if(!allGroups().includes(name))pinnedGroups.push(name);
  activeGroup=name;
  persist();renderAll();
  toast('已新建标签「'+name+'」，给它加记录：右键记录 → 加入已有标签');
 }
 // ── 记录上的标签编辑 ──────────────────────────────────────────
 function addGroup(rec,rawName){
  const name=String(rawName||'').trim();
  if(!name)return;
  const groups=groupsOf(rec);
  if(groups.includes(name))return;
  rec.groups=[...groups,name];
  persist();renderAll();
  toast('已加入「'+name+'」');
 }
 function removeGroup(rec,name){
  rec.groups=groupsOf(rec).filter(g=>g!==name);
  persist();renderAll();
 }
 function hideMenu(){$('menu').classList.remove('show');menuTarget=null}
 function showMenu(x,y,html){
  const m=$('menu');
  m.innerHTML=html;
  m.classList.add('show');
  const w=m.offsetWidth,h=m.offsetHeight;
  m.style.left=Math.max(4,Math.min(x,innerWidth-w-4))+'px';
  m.style.top=Math.max(4,Math.min(y,innerHeight-h-4))+'px';
 }
 // 记录行右键菜单：新建标签 / 从已有标签选 / 删除
 function recordMenu(rec,x,y){
  menuTarget=rec;
  const groups=groupsOf(rec);
  const avail=allGroups().filter(g=>!groups.includes(g));
  const html='<div class="mi" data-act="copy">复制命令</div>'
   +'<div class="mi" data-act="newgroup">新建标签并加入…</div>'
   +(avail.length?'<div class="sep"></div><div class="mi" data-act="none"><span style="color:#a2aca1">加入已有标签</span></div>'
     +avail.map(g=>'<div class="mi" data-group="'+esc(g)+'">'+esc(g)+'</div>').join(''):'')
   +(groups.length?'<div class="sep"></div><div class="mi" data-act="none"><span style="color:#a2aca1">移出标签</span></div>'
     +groups.map(g=>'<div class="mi" data-ungroup="'+esc(g)+'">'+esc(g)+'</div>').join(''):'')
   +'<div class="sep"></div><div class="mi danger" data-act="delete">删除这条记录</div>';
  showMenu(x,y,html);
 }
 // 输入新标签名（菜单内联输入）
 function promptGroup(rec,x,y){
  menuTarget=rec;
  const html='<input id="newgroup" placeholder="标签名，回车确认">';
  if(x!==undefined)showMenu(x,y,html);
  else{$('menu').innerHTML=html;$('menu').classList.add('show')}
  const input=$('newgroup');
  try{input.focus()}catch(e){}
  input.addEventListener('keydown',ev=>{
   if(isEnterKey(ev)){ev.preventDefault();addGroup(rec,input.value);hideMenu()}
   else if(ev.key==='Escape')hideMenu();
  });
  input.addEventListener('click',ev=>ev.stopPropagation());
 }
 $('menu').addEventListener('click',e=>{
  e.stopPropagation();
  const item=e.target.closest('.mi');
  if(!item||!menuTarget)return;
  // 标签菜单（右键顶部标签）
  if(item.dataset.tagact){
   const name=menuTarget.tag;
   if(item.dataset.tagact==='delete'){deleteGroup(name);hideMenu();return}
   if(item.dataset.tagact==='rename'){
    const box=e.currentTarget.getBoundingClientRect();
    hideMenu();
    inlineTagInput('rename',name);
    return;
   }
  }
  const rec=menuTarget;
  if(!rec||!rec.id)return;
  if(item.dataset.group){addGroup(rec,item.dataset.group);hideMenu();return}
  if(item.dataset.ungroup){removeGroup(rec,item.dataset.ungroup);hideMenu();return}
  switch(item.dataset.act){
   case 'copy':
    toast(copyText(rec.command)?'已复制命令':'复制失败');hideMenu();break;
   case 'delete':
    records=records.filter(r=>r.id!==rec.id);persist();renderAll();hideMenu();toast('已删除');break;
   case 'newgroup':{
    const box=e.currentTarget.getBoundingClientRect();
    promptGroup(rec,box.left,box.top);
    break;
   }
   default:break;
  }
 });
 document.addEventListener('click',e=>{if(!e.target.closest('#menu'))hideMenu()});
 // 搜索框的按键是 Electron 合成的：只带 keyCode，没有 key/code，所以三种特征都认
 function isEnterKey(e){
  if(e.key==='Enter'||e.key==='Return')return true;
  if(e.code==='Enter'||e.code==='NumpadEnter')return true;
  if(e.keyCode===13||e.which===13)return true;
  return false;
 }
 function isUpKey(e){
  if(e.key==='ArrowUp'||e.key==='Up')return true;
  if(e.code==='ArrowUp')return true;
  if(e.keyCode===38||e.which===38)return true;
  return false;
 }
 function isDownKey(e){
  if(e.key==='ArrowDown'||e.key==='Down')return true;
  if(e.code==='ArrowDown')return true;
  if(e.keyCode===40||e.which===40)return true;
  return false;
 }
 // 输入变了：过滤结果就变了，之前的选中下标会指向另一条，必须清掉
 function setCommand(text){
  currentCommand=String(text??'');
  clearSelection();
  renderAll();
 }
 if(rubick&&typeof rubick.setSubInput==='function'){
  try{
   rubick.setSubInput(data=>{
    const text=data&&typeof data==='object'?(data.text??''):(data??'');
    setCommand(text);
   },'输入路径、程序名或命令，回车运行',true);
   subInputReady=true;
  }catch(e){logLine('env','接管搜索框失败 '+e.message)}
 }
 // 搜索框按键被 sendInputEvent 转发进页面：合成事件只有 keyCode，没有 key。
 // 注意这是捕获阶段，会早于输入框自己的处理器 —— 所以有内联输入框在场时必须让路，
 // 否则在标签输入框里按回车会先被当成"执行命令"。
 function inlineInputActive(){
  return !!$('tagInput')||($('menu').classList.contains('show')&&!!$('newgroup'));
 }
 window.addEventListener('keydown',e=>{
  if(inlineInputActive())return;   // 有内联输入框时让路，交给它自己的处理器
  if(isEnterKey(e)){
   e.preventDefault();
   // 上下键选过就跑选中的；没选过就跑输入的原文
   const rec=selectedRecord();
   if(rec){clearSelection();launch(rec.command)}
   else launch(currentCommand);
  }else if(isUpKey(e)||isDownKey(e)){
   e.preventDefault();
   moveSelection(isDownKey(e)?1:-1);
  }else if(e.key==='Escape'||e.code==='Escape'||e.keyCode===27){
   hideMenu();clearSelection();setCommand('');
  }
 },true);
 $('list').addEventListener('scroll',()=>{scrollTop=$('list').scrollTop;renderRows()});
 $('list').addEventListener('click',e=>{
  const row=e.target.closest('.row');
  const rec=row?records.find(r=>r.id===row.dataset.id):null;
  if(!rec)return;
  const un=e.target.closest('[data-ungroup]');
  if(un){e.stopPropagation();removeGroup(rec,un.dataset.ungroup);return}
  launch(rec.command);
 });
 $('list').addEventListener('contextmenu',e=>{
  const row=e.target.closest('.row');
  if(!row)return;
  const rec=records.find(r=>r.id===row.dataset.id);
  if(!rec)return;
  e.preventDefault();
  recordMenu(rec,e.clientX,e.clientY);
 });
 $('tags').addEventListener('click',e=>{
  // ＋ 标签：在这一行内直接输入名字
  if(e.target.closest('#tagAdd')){inlineTagInput('create');return}
  const t=e.target.closest('[data-group]');
  if(!t)return;
  activeGroup=t.dataset.group||'';
  clearSelection();                 // 换标签后过滤结果变了，选中下标作废
  renderAll();
  $('list').scrollTop=0;scrollTop=0;
 });
 // 右键顶部标签：重命名 / 删除
 $('tags').addEventListener('contextmenu',e=>{
  const t=e.target.closest('[data-group]');
  if(!t||!t.dataset.group)return;      // 「全部」不可改名/删除
  e.preventDefault();
  tagMenu(t.dataset.group,e.clientX,e.clientY);
 });
 records=load();
 if(rubick&&typeof rubick.onPluginReady==='function'){
  rubick.onPluginReady(()=>{records=load();renderAll();try{rubick.setExpendHeight(570)}catch(e){}});
 }
 renderAll();
})();
</script></body></html>
